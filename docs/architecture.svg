<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">LoanLens AI system architecture</title>
  <desc id="desc">Four roles use a React frontend and an authenticated Express API. Deterministic core and AI modules use PostgreSQL and pgvector, masked hosted Gemini calls, local uploads and ordered audit events. Only a human credit analyst submits final credit decisions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#507478"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #183c40; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #506e73; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #168080; }
      .line { fill: none; stroke: #507478; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: white; stroke: #c9dcde; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#f3f8f8"/>
  <text x="60" y="57" class="tag">HCLTECH HACKATHON · KESTREL BANK</text>
  <text x="60" y="106" style="font-size:38px;font-weight:700">LoanLens AI · System architecture</text>
  <text x="60" y="138" class="body">Grounded policy assistance, deterministic loan calculations and human credit decisions.</text>

  <text x="60" y="194" class="tag">CLIENT</text>
  <rect x="60" y="215" width="300" height="200" rx="16" class="box"/>
  <text x="82" y="252" class="heading">React web application</text>
  <text x="82" y="286" class="body">Customer · Loan Officer</text>
  <text x="82" y="313" class="body">Credit Analyst · Policy Admin</text>
  <text x="82" y="353" class="small">Vite · Tailwind · typed API hooks</text>
  <text x="82" y="382" class="small">5173 dev / 8080 built application</text>

  <text x="480" y="194" class="tag">BACKEND · NODE 22 / EXPRESS</text>
  <rect x="480" y="215" width="480" height="90" rx="16" fill="#105e63"/>
  <text x="503" y="251" style="font-size:23px;font-weight:700;fill:white">Authenticated API boundary</text>
  <text x="503" y="280" style="font-size:17px;fill:#d2eded">JWT · role checks · Zod validation · error envelopes</text>
  <rect x="480" y="345" width="480" height="205" rx="16" class="box"/>
  <text x="503" y="381" class="heading">Core + AI modules</text>
  <text x="503" y="415" class="body">Core: products, EMI, applications, uploads</text>
  <text x="503" y="447" class="body">Advisor: extract intent → calculate in code</text>
  <text x="503" y="479" class="body">Policy: RAG, drafts, publish, retire</text>
  <text x="503" y="511" class="body">Pre-screen: fixed agents + guarded tools</text>

  <rect x="480" y="595" width="480" height="105" rx="16" class="box"/>
  <text x="503" y="633" class="heading">AI safety boundary</text>
  <text x="503" y="663" class="body">PII masking · schemas · citations · safe fallback</text>
  <rect x="480" y="755" width="480" height="90" rx="16" class="box"/>
  <text x="503" y="792" class="heading">Persisted workflow audit</text>
  <text x="503" y="821" class="body">Runs · ordered events · permission refusals</text>

  <text x="1080" y="194" class="tag">DATA + INTEGRATIONS</text>
  <rect x="1080" y="345" width="300" height="155" rx="16" class="box"/>
  <text x="1102" y="384" class="heading">PostgreSQL + pgvector</text>
  <text x="1102" y="418" class="body">Loans · policies · audit</text>
  <text x="1102" y="449" class="body">768-dimension vectors</text>
  <text x="1102" y="479" class="small">Prisma + versioned migrations</text>
  <rect x="1080" y="595" width="300" height="130" rx="16" class="box"/>
  <text x="1102" y="633" class="heading">Hosted Gemini APIs</text>
  <text x="1102" y="666" class="body">Chat + embeddings</text>
  <text x="1102" y="698" class="small">Keys stay on the backend</text>
  <rect x="1080" y="775" width="300" height="70" rx="16" class="box"/>
  <text x="1102" y="816" class="heading">Local upload storage</text>

  <rect x="60" y="595" width="300" height="250" rx="16" fill="#e0f0ed" stroke="#9bc7bd" stroke-width="1.5"/>
  <text x="82" y="634" class="heading">Human credit decision</text>
  <text x="82" y="673" class="body">Only the Credit Analyst</text>
  <text x="82" y="702" class="body">can approve or reject.</text>
  <text x="82" y="748" class="small">Agents recommend; tools cannot</text>
  <text x="82" y="771" class="small">make final credit decisions.</text>
  <text x="82" y="813" class="small">Bureau / income / KYC are synthetic.</text>

  <path d="M360 260H480" class="line"/>
  <text x="377" y="242" class="small">JWT / API</text>
  <path d="M720 305V345" class="line"/>
  <path d="M960 410H1080" class="line"/>
  <text x="989" y="393" class="small">SQL</text>
  <path d="M720 550V595" class="line"/>
  <path d="M960 646H1080" class="line"/>
  <text x="981" y="630" class="small">HTTPS</text>
  <path d="M720 700V755" class="line"/>
  <path d="M960 800H1035V470H1080" class="line"/>
  <path d="M960 520H1007V810H1080" class="line"/>
  <path d="M360 666H420V487H480" class="line"/>
  <text x="60" y="903" class="small">Synthetic hackathon data · API keys never reach the browser · External AI needs network and quota</text>
</svg>
